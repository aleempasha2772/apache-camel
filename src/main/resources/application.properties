spring.application.name=apache-camel
# ===== H2 in-memory DB =====
spring.datasource.url=jdbc:h2:mem:cameldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=aleem
spring.datasource.password=aleem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console (dev convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Camel REST over Servlet =====
# Map Camel's servlet under /rest/*
camel.component.servlet.mapping.contextPath=/rest/*
# Optional REST DSL defaults

camel.rest.component=platform-http
camel.rest.binding-mode=json
camel.rest.context-path=/rest
